<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <style>
            #body{
                background-image: url('https://github.com/11pro11/namepicker/blob/main/background.jpg?raw=true');
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center center;
                background-attachment: fixed;
                background-size: cover;
                margin: 0;
                padding: 0;
            }
            #banner{
                display: flex;
                justify-content: center;
                margin-top: 5%;
            }
            .wish{
                position: fixed;
                bottom: 1rem;
                right: 1rem;
            }
            #name1{
                position: relative;
                font-size: 15rem;
                font-family: "Times New Roman", Times, serif;
                font-weight: 400;
                color: goldenrod;
                top: 12rem;
                left: 13rem;
                right: 13rem;
                display: none;
            }
        </style>
    </head>
    <body id="body">

        <div onclick="wish(); setTimeout(wishend, 6500)" class="wish">
            <img id="wish1" style="display: inline;" src="https://github.com/11pro11/namepicker/blob/main/wish1.png?raw=true" width="300rem">
            <img id="wish10" style="display: inline;" src="https://github.com/11pro11/namepicker/blob/main/wish10.png?raw=true" width="300rem">
        </div>

        <div onclick="revert()" style="display:none" id="name1"></div>

        <div id="banner"><img src="https://github.com/11pro11/namepicker/blob/main/bannerfinal.png?raw=true" width="80%"></div>

        <script>
            function wish() {
                document.getElementById('wish1').style.display = 'none'
                document.getElementById('wish10').style.display = 'none'
                document.getElementById('banner').style.display = 'none'
                document.getElementById('body').style.backgroundImage = "url('https://github.com/11pro11/namepicker/blob/main/wishanimation.gif?raw=true')"
            }
            function wishend() {
                document.getElementById('body').style.backgroundImage = "url('https://github.com/11pro11/namepicker/blob/main/good.jpg?raw=true')"
                namepicker()
                document.getElementById('name1').style.display = 'flex'
            }
            function revert() {
                document.getElementById('wish1').style.display = 'inline'
                document.getElementById('wish10').style.display = 'inline'
                document.getElementById('banner').style.display = 'flex'
                document.getElementById('body').style.backgroundImage = "url('https://github.com/11pro11/namepicker/blob/main/background.jpg?raw=true')"
                document.getElementById('name1').style.display = 'none'
            }
            function namepicker() {
                var generated = Math.floor(Math.random() * 24)+1;
                if (generated === 1) {
                    document.getElementById('name1').innerHTML = 'Angeline'
                } else if (generated === 2) {
                    document.getElementById('name1').innerHTML = 'Brandon'
                } else if (generated === 3) {
                    document.getElementById('name1').innerHTML = 'Kah Hin'
                } else if (generated === 4) {
                    document.getElementById('name1').innerHTML = 'Chloe Lin'
                } else if (generated === 5) {
                    document.getElementById('name1').innerHTML = 'Linze'
                } else if (generated === 6) {
                    document.getElementById('name1').innerHTML = 'Heqi'
                } else if (generated === 7) {
                    document.getElementById('name1').innerHTML = 'Jin Wei'
                } else if (generated === 8) {
                    document.getElementById('name1').innerHTML = 'Huang An'
                } else if (generated === 9) {
                    document.getElementById('name1').innerHTML = 'Jun Wei'
                } else if (generated === 10) {
                    document.getElementById('name1').innerHTML = 'Yufeng'
                } else if (generated === 11) {
                    document.getElementById('name1').innerHTML = 'Laura'
                } else if (generated === 12) {
                    document.getElementById('name1').innerHTML = 'Kana'
                } else if (generated === 13) {
                    document.getElementById('name1').innerHTML = 'Tony'
                } else if (generated === 14) {
                    document.getElementById('name1').innerHTML = 'Sunny'
                } else if (generated === 15) {
                    document.getElementById('name1').innerHTML = 'Zhanyuan'
                } else if (generated === 16) {
                    document.getElementById('name1').innerHTML = 'Chee Hong'
                } else if (generated === 17) {
                    document.getElementById('name1').innerHTML = 'Chloe Loo'
                } else if (generated === 18) {
                    document.getElementById('name1').innerHTML = 'Yogan'
                } else if (generated === 19) {
                    document.getElementById('name1').innerHTML = 'Marissa'
                } else if (generated === 20) {
                    document.getElementById('name1').innerHTML = 'Qianya'
                } else if (generated === 21) {
                    document.getElementById('name1').innerHTML = 'Rhys'
                } else if (generated === 22) {
                    document.getElementById('name1').innerHTML = 'Junxi'
                } else if (generated === 23) {
                    document.getElementById('name1').innerHTML = 'Xinrui'
                } else if (generated === 24) {
                    document.getElementById('name1').innerHTML = 'Zhengyue'
                } else if (generated === 25) {
                    document.getElementById('name1').innerHTML = 'Beihao'
                } 
            }
        </script>
    </body>
</html>
